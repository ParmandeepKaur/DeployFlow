version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: deployflow-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deployflow

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .

    container_name: deployflow-backend

    ports:
      - "5000:5000"

    env_file:
      - .env

    depends_on:
      - postgres

volumes:
  postgres_data: